name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resin
          POSTGRES_PASSWORD: resin
          POSTGRES_DB: resin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U resin -d resin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resin:resin@localhost:5432/resin_test?schema=public
      DATABASE_URL_TEST: postgresql://resin:resin@localhost:5432/resin_test?schema=public
      AUTH_SECRET: ci-secret-not-used-in-production-000000000000
      ADMIN_EMAIL: ash@example.com
      ADMIN_PASSWORD: ci-password-123
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_WHATSAPP_NUMBER: "923001234567"
      NEXT_PUBLIC_WHATSAPP_DISPLAY: "+92 300 1234567"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply database schema
        if: hashFiles('prisma/schema.prisma') != ''
        run: npx prisma migrate deploy

      - name: Seed the database
        if: hashFiles('prisma/schema.prisma') != ''
        run: npm run db:seed

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end and visual tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
